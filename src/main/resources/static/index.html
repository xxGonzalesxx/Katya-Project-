<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Веб-сервис управления общежитием: задачи, дежурства, бронирование, оплата.">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Временная SVG-иконка домика вместо пустой заглушки -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    
    <!-- Современный UI-шрифт с отличной кириллицей -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 и ваши стили -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    
    <title>DormHub — управление общежитием</title>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Липкий стеклянный навбар -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#/home">
            <span class="badge bg-primary rounded-3 px-2 py-1">DH</span>
            <span>DormHub</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto gap-1" id="nav-links"></ul>
            <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0" id="nav-auth"></div>
        </div>
    </div>
</nav>

<!-- Основной контент растягивается на всю свободную высоту -->
<main id="app" class="container py-4 flex-grow-1"></main>

<!-- Лаконичный футер для завершенности интерфейса -->
<footer class="py-3 mt-auto text-center text-muted-sm">
    <div class="container">
        <span>DormHub &copy; 2026 &middot; Студенческий кампус</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
